[project]
name = "myunc-scraper"
version = "2.0.0"
description = "Scraper for UNC's web portal and OES"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "icalendar>=5.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "apprise>=1.7.0",
    "pandas>=3.0.3",
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "inquirer>=3.4.1",
    "argcomplete>=3.6.3",
]

[project.scripts]
myunc-scraper = "src.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
